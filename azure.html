<!DOCTYPE html>
<html>
<head>
    <title>Linux Users</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        table {
            border-collapse: collapse;
            width: 500px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>Linux Users</h2>

    <table>
        <tr>
            <th>Username</th>
            <th>UID</th>
            <th>Home Directory</th>
        </tr>

        <tr>
            <td>root</td>
            <td>0</td>
            <td>/root</td>
        </tr>

        <tr>
            <td>john</td>
            <td>1001</td>
            <td>/home/john</td>
        </tr>

        <tr>
            <td>testuser</td>
            <td>1002</td>
            <td>/home/testuser</td>
        </tr>
    </table>

</body>
</html>
